name: Build ScrollStop Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Command-line Tools
        run: |
          ANDROID_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV

          # Ensure compatible cmdline-tools is available
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing compatible Android Command-line Tools (v13.0 / 11076708)..."
            mkdir -p "$ANDROID_ROOT/cmdline-tools"
            curl -sSLo cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q -o cmdline-tools.zip -d "$ANDROID_ROOT/cmdline-tools"
            rm -f cmdline-tools.zip
            rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi

          # Add command-line tools and platform-tools to PATH
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."
          yes | $SDKMANAGER --licenses || true

          echo "Installing Android SDK Platform 34 and Build Tools 34.0.0..."
          $SDKMANAGER --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "SUCCESS: app-debug.apk generated successfully."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: APK file not found at expected location!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollStop-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Failure Diagnostics
        if: failure()
        run: |
          echo "==== GRADLE BUILD FAILED ===="
          echo "Review above logs or gradle stacktrace for exact error details."
